<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmlearn · 从零可视化学 LLM</title>
<style>
  :root{--bg:#f7f5f0;--card:#fffdf8;--ink:#1d1b16;--muted:#6b665c;--line:#e4ded2;--accent:#c2410c}
  @media (prefers-color-scheme: dark){:root{--bg:#17150f;--card:#201d16;--ink:#f1ece2;--muted:#a39d90;--line:#36312766;--accent:#fb923c}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
  main{max-width:860px;margin:0 auto;padding:48px 20px}
  .tag{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--accent)}
  h1{font-size:36px;margin:6px 0}
  p.lead{color:var(--muted)}
  h2{font-size:15px;color:var(--muted);margin:32px 0 10px;font-weight:600}
  a.card,div.card{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;color:inherit;text-decoration:none}
  a.card:hover{border-color:var(--accent)}
  div.card{opacity:.5}
  .n{font:700 20px ui-monospace,Menlo,monospace;color:var(--accent)}
  .t b{display:block} .t span{font-size:14px;color:var(--muted)}
  .s{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="tag">LLMLEARN</div>
  <h1>从零可视化学 LLM</h1>
  <p class="lead">从 Transformer 原理一路走到 Agent。每一课都有可以亲手操作的可视化页面。</p>
  <div id="list"></div>
</main>
<script>
const stages = [
  ["阶段一 · 看懂 Transformer", [
    ["01","Tokenization 与 Embedding","文字如何变成数字","lessons/01-tokenization-embedding/viz.html"],
    ["02","Self-Attention","Q / K / V 与注意力矩阵"],
    ["03","多头注意力 + 位置编码","多个子空间；模型如何感知顺序"],
    ["04","Transformer Block","残差、LayerNorm、FFN、因果掩码"]]],
  ["阶段二 · 写出一个 GPT", [
    ["05","从零写 mini-GPT","numpy 手写前向与反向传播"],
    ["06","采样与生成","温度、top-k、top-p、KV Cache"]]],
  ["阶段三 · 从基座到助手", [
    ["07","预训练 → SFT → RLHF / DPO","聊天模型是如何炼成的"],
    ["08","Scaling 与高效推理","Scaling Law、量化、MoE、长上下文"]]],
  ["阶段四 · 走向 Agent", [
    ["09","Prompt 与 In-Context Learning","为什么提示词有效"],
    ["10","RAG","检索增强生成"],
    ["11","Tool Use","让模型调用工具"],
    ["12","ReAct Agent","思考—行动—观察循环"],
    ["13","多 Agent、记忆与评估","规划、记忆、协作、评测"]]],
];
document.getElementById("list").innerHTML = stages.map(([h,ls]) => `<h2>${h}</h2>` + ls.map(([n,t,d,u]) =>
  u ? `<a class="card" href="${u}"><span class="n">${n}</span><span class="t"><b>${t}</b><span>${d}</span></span><span class="s">开始 →</span></a>`
    : `<div class="card"><span class="n">${n}</span><span class="t"><b>${t}</b><span>${d}</span></span><span class="s">即将上线</span></div>`).join("")).join("");
</script>
</body>
</html>
